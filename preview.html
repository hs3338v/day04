<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>preview</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header>
      <div class="wordmark">day<span>04</span></div>
      <nav>
        <a href="index.html">index</a>
        <a href="about.html">about</a>
        <a href="preview.html" class="active">preview</a>
      </nav>
    </header>

    <main>
      <h1>test_todos</h1>
      <p class="lede">Supabase의 test_todos 테이블을 그대로 불러와 보여줍니다.</p>

      <ul class="todo-table" id="todo-list">
        <li class="state-msg">불러오는 중...</li>
      </ul>

      <a class="back" href="index.html">index로 돌아가기</a>
    </main>
  </div>

  <script>
    const SUPABASE_URL = "https://zdzbswbgmodmyfwoonwa.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_j51YaF8ar-5rvxaiXMpFKA_Ys-3X6Nn";

    async function loadTodos() {
      const listEl = document.getElementById("todo-list");

      try {
        const res = await fetch(`${SUPABASE_URL}test_todos?select=*`, {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!res.ok) {
          throw new Error(`요청 실패: ${res.status}`);
        }

        const todos = await res.json();

        listEl.innerHTML = "";

        if (todos.length === 0) {
          listEl.innerHTML = '<li class="state-msg">데이터가 없습니다.</li>';
          return;
        }

        todos.forEach((todo) => {
          const li = document.createElement("li");

          const row = document.createElement("div");
          row.className = `todo-row ${todo.done ? "done" : ""}`;

          const title = document.createElement("span");
          title.className = "todo-title";
          title.textContent = todo.title ?? "(제목 없음)";
          row.appendChild(title);

          const status = document.createElement("span");
          status.className = `todo-status ${todo.done ? "done" : "pending"}`;
          status.textContent = todo.done ? "완료" : "진행 중";
          row.appendChild(status);

          const metaParts = [];
          if (todo.amount !== undefined && todo.amount !== null) {
            metaParts.push(`수량 ${todo.amount}`);
          }
          if (todo.due_date) {
            metaParts.push(`마감 ${todo.due_date}`);
          }
          if (todo.created_at) {
            metaParts.push(`등록 ${new Date(todo.created_at).toLocaleDateString("ko-KR")}`);
          }
          if (metaParts.length > 0) {
            const meta = document.createElement("span");
            meta.className = "todo-meta";
            meta.textContent = metaParts.join("  ·  ");
            row.appendChild(meta);
          }

          li.appendChild(row);
          listEl.appendChild(li);
        });
      } catch (err) {
        listEl.innerHTML = `<li class="state-msg">불러오기 실패: ${err.message}</li>`;
      }
    }

    loadTodos();
  </script>
</body>
</html>
